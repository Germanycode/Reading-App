services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env.production
    volumes:
      - ./backend/data:/app/data
      - ./assets:/assets
    environment:
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      AUDIOBOOKS_DIR: /app/data/audiobooks
      ASSETS_BOOKS_DIR: /assets/books
      ASSETS_MUSICS_DIR: /assets/musics
      ASSETS_ICONS_DIR: /assets/icons
      DATABASE_URL: sqlite+aiosqlite:////app/data/db.sqlite

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      - backend
